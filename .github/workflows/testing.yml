name: CD Testing

on:
  push:
    branches: [ testing ]

jobs:
  push-to-testing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_TESTING_PRIVATE_KEY }}

    - name: Deploy to testing enviroment
      run: |
        ssh -o StrictHostKeyChecking=no github-actions@professionkid-testing.ru "
          cd /home/shared/profession &&
          git pull origin testing --rebase &&
          docker compose down &&
          docker compose up --build -d
        "
