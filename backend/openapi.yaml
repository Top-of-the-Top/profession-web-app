openapi: 3.0.3
info:
  title: Профессия — API
  version: 1.0.0
  description: |-
    «Профессия» — образовательная онлайн-платформа для проведения структурированных курсов с видеосвязью, интерактивной доской и встроенным ИИ-помощником.

    Платформа объединяет каталог платных курсов, онлайн-вебинары, просмотр записей, домашние задания с автоматической и ручной проверкой, а также специальные курсы по приглашению преподавателя — без оплаты и без отображения в общем каталоге.

    **Аутентификация**

    Все защищённые эндпоинты принимают JWT-токен в заголовке:

    ```
    Authorization: Bearer <access_token>
    ```

    Токены выдаются при входе, регистрации и OAuth-авторизации. Обновление — через `POST /api/v1/refresh/`.

    **Роли пользователей**

    | Роль | Описание |
    |------|----------|
    | `student` | Покупает курсы, выполняет задания, смотрит вебинары |
    | `teacher` | Ведёт курсы, проводит вебинары, проверяет задания |
    | `moderator` | Полный доступ ко всем операциям платформы |

    **Формат ошибок**

    Все бизнес-ошибки возвращаются в едином формате:

    ```json
    {
      "status": "error",
      "code": "КОД_ОШИБКИ",
      "message": "Сообщение ошибки.",
      "details": {}
    }
    ```
