components:
  schemas:
    ApplicationReviewed:
      type: object
      properties:
        application_id:
          type: string
          format: uuid
          readOnly: true
        status:
          enum:
          - pending
          - approved
          - rejected
          type: string
          description: |-
            * `pending` - На рассмотрении
            * `approved` - Одобрена
            * `rejected` - Отклонена
          x-spec-enum-id: 6809cfa7cfb50d5c
          readOnly: true
          title: Статус
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - application_id
      - reviewed_at
      - reviewed_by
      - status
    ApplicationUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 30
        last_name:
          type: string
          maxLength: 30
        email:
          type: string
          readOnly: true
      required:
      - email
      - id
    Attempt:
      type: object
      properties:
        homework_id:
          type: string
          format: uuid
          readOnly: true
        attempt_id:
          type: string
          format: uuid
          readOnly: true
          title: Id
        status:
          enum:
          - draft
          - submitted
          - reviewed
          type: string
          description: |-
            * `draft` - Черновик
            * `submitted` - Отправлено
            * `reviewed` - Оценено
          x-spec-enum-id: 153147105986e70d
          readOnly: true
          title: Статус
        deadline:
          type: string
          format: date-time
          readOnly: true
        score:
          type: integer
          readOnly: true
          nullable: true
        max_points:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttemptItem'
          readOnly: true
      required:
      - attempt_id
      - deadline
      - homework_id
      - items
      - max_points
      - score
      - status
    AttemptItem:
      oneOf:
      - $ref: '#/components/schemas/QuestionAttemptItem'
      - $ref: '#/components/schemas/TaskAttemptItem'
      discriminator:
        propertyName: type
        mapping:
          question: '#/components/schemas/QuestionAttemptItem'
          task: '#/components/schemas/TaskAttemptItem'
    AttemptReview:
      type: object
      properties:
        attempt_id:
          type: string
          format: uuid
