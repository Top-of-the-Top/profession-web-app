services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_ADMINKA_GATEWAY_URL=${VITE_ADMINKA_GATEWAY_URL:-http://localhost:8080}
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: profession_web_app_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - app_network

  celery_worker:
    build: ./backend
    container_name: profession_web_app_celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: celery -A project worker --loglevel=info
    depends_on:
      - redis
      - backend
    networks:
      - app_network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network


volumes:
  static_volume:
  media_volume:
  frontend_node_modules:
  redis_data:

networks:
  app_network:
    driver: bridge