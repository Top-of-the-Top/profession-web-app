name: CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@professionkid.ru
          cd /home/shared/profession &&
          git pull origin main &&
          docker-compose down &&
          docker-compose up -d
        "
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
