  /api/v1/auth/vk/callback/:
    get:
      operationId: auth_vk_callback_retrieve
      description: Принимает данные от VK ID после авторизации. Пробрасывает code,
        state и обязательный device_id на фронтенд через редирект.
      summary: Callback для ВКонтакте OAuth
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: Код авторизации
      - in: query
        name: device_id
        schema:
          type: string
        description: Идентификатор устройства
      - in: query
        name: error
        schema:
          type: string
        description: Код ошибки
      - in: query
        name: state
        schema:
          type: string
        description: CSRF-токен
      tags:
      - Users
      security:
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/auth/vk/exchange/:
    post:
      operationId: auth_vk_exchange_create
      description: Обменивает code, state, code_verifier и device_id от VK OAuth на
        JWT-токены платформы. Если пользователь не найден — создаётся автоматически.
      summary: Авторизация через ВКонтакте
      tags:
      - Users
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
              code:
                type: string
                description: Код авторизации от VK OAuth
              state:
                type: string
                description: CSRF-токен, выданный при старте OAuth
              code_verifier:
                type: string
                description: PKCE code_verifier
              device_id:
                type: string
                description: Идентификатор устройства из VK SDK
          required:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
