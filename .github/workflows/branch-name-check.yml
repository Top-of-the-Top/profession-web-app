name: Branch Name Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest

    # Пропускаем develop
    if: github.head_ref != 'develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name
        id: get_branch
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "🔎 Branch name: $BRANCH_NAME"

      - name: Check - branch name is not empty
        run: |
          BRANCH="${{ steps.get_branch.outputs.branch_name }}"
          if [[ -z "$BRANCH" ]]; then
            echo "❌ Branch name is empty"
            exit 1
          fi
          echo "✅ Branch name isn't empty"

      - name: Check - no trailing slash or hyphen
        run: |
          BRANCH="${{ steps.get_branch.outputs.branch_name }}"
          if [[ "$BRANCH" == */ || "$BRANCH" == *- ]]; then
            echo "❌ Branch name must not end with '/' or '-'"
            exit 1
          fi
          echo "✅ Branch name doesn't end with '/' or '-'"

      - name: Check - allowed characters only
        run: |
          BRANCH="${{ steps.get_branch.outputs.branch_name }}"
          if [[ "$BRANCH" =~ ^[a-z0-9A-Z/-]+$ ]]; then
            echo "✅ Only allowed characters used"
          else
            echo "❌ Branch contains disallowed characters"
            echo "   Allowed: a-z, A-Z, 0-9, /, -"
            exit 1
          fi

      - name: Check - valid branch format
        run: |
          BRANCH="${{ steps.get_branch.outputs.branch_name }}"

          regex_dev='^(feature|fix|hotfix|refactor|test)/(frontend|backend|infra|api|video|ai)/KAN-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          regex_general='^(docs|guides|chore|general|meetings)/KAN-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ "$BRANCH" =~ $regex_dev || "$BRANCH" =~ $regex_general ]]; then
            echo "✅ Branch format is valid"
          else
            echo "❌ Invalid branch format"
            echo ""
            echo "📌 Allowed formats:"
            echo "  feature/frontend/KAN-32-auth-form"
            echo "  fix/backend/KAN-15-login-bug"
            echo "  hotfix/api/KAN-101-crash-on-start"
            echo "  docs/KAN-5-update-readme"
            echo "  chore/KAN-9-setup-ci"
            echo ""
            echo "📌 Rules:"
            echo "  - KAN-<number> is required"
            echo "  - Description must be kebab-case"
            echo "  - Only lowercase letters in description"
            exit 1
          fi

      - name: All checks passed
        run: |
          echo "🎉 Branch name is valid!"
