services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ADMINKA_GATEWAY_URL: ${VITE_ADMINKA_GATEWAY_URL:-http://localhost:9000}
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: profession_web_app_backend
    env_file:
      - ./backend/.env
    command: daphne -b 0.0.0.0 -p 9000 project.asgi:application
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    networks:
      - app_network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network

  celery_worker:
    build: ./backend
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: celery -A project worker --loglevel=info --concurrency=3
    depends_on:
      - rabbitmq
      - redis
      - backend
    environment:
      - PYTHONPATH=/app
      - RABBITMQ_HOST=rabbitmq
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    networks:
      - app_network
  
  celery-beat:
    build: ./backend
    command: celery -A project beat -l info
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - redis
      - rabbitmq
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    networks:
      - app_network

  flower:
    build: ./backend
    container_name: flower
    working_dir: /app
    command: celery -A project flower --port=5555
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "15666:5555"
    depends_on:
      - rabbitmq
    networks:
      - app_network

volumes:
  static_volume:
  media_volume:
  frontend_node_modules:
  redis_data:
  rabbitmq_data:

networks:
  app_network:
    driver: bridge