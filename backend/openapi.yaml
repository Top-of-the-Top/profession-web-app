tags:
- name: Landing
  description: Публичные эндпоинты для лендинга. Не требуют авторизации.
- name: Users
  description: Регистрация, вход, сброс пароля, управление профилем. Поддерживается
    авторизация через email, телефон, Яндекс и ВКонтакте.
- name: Home
  description: Домашняя страница приложения.
- name: Course
  description: Каталог курсов, карточка курса, структура (секции и уроки). Редактирование
    доступно автору курса и модератору.
- name: Homework
  description: Домашние задания, задачи с развёрнутым ответом и вопросы с вариантами.
    Студент сдаёт попытку, преподаватель проверяет и выставляет баллы.
- name: Webinar
  description: 'Управление вебинарами: запуск, остановка, расписание, подключение
    участников. Запись через Agora Cloud Recording с последующей загрузкой в Kinescope.'
- name: Carts
  description: 'Корзина покупок: добавление и удаление курсов, оплата.'
- name: Payments
  description: История платежей и детали конкретного платежа.
- name: Applications
  description: Заявки на специальные курсы. Студент подаёт заявку, преподаватель или
    модератор одобряет или отклоняет её.
- name: Notifications
  description: 'Уведомления пользователя: постраничный список и real-time поток через
    Server-Sent Events.'
- name: Statistics
  description: 'Аналитика для преподавателей и модераторов: посещаемость вебинаров,
    прогресс студентов, сводные таблицы по курсам и преподавателям.'
- name: Admin Panel
  description: 'Инструменты модератора: управление преподавателями на курсах, публикация
    курсов, приглашения для регистрации новых преподавателей.'
- name: Assets
  description: 'Загрузка медиафайлов в S3: инициация загрузки, получение presigned
    URL и проверка статуса ассета.'
