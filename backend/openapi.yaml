        detail:
          type: string
          readOnly: true
      required:
      - detail
      - status
    Course:
      type: object
      description: |-
        Подмешивается в ModelSerializer.

        Подкласс объявляет:
            asset_roles = ['course_cover']

        При одиночной сериализации делает один запрос к AssetUsage.
        При many=True (через ListSerializer) делает ОДИН батч-запрос на весь список.

        При записи (create/update) ищет поля вида <role>_asset_id / <role>_asset_ids
        и синкает привязки через BindingApi.
      properties:
        course_id:
          type: string
          format: uuid
          readOnly: true
          title: Id
        cover_asset_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        authors:
          type: array
          items:
            $ref: '#/components/schemas/CourseAuthor'
          readOnly: true
        image_url:
          type: string
          readOnly: true
        is_enrolled:
          type: string
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        application_status:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        type:
          enum:
          - draft
          - published
          type: string
          description: |-
            * `draft` - черновик
            * `published` - опубликован
          x-spec-enum-id: fdbf70d2e9ee7caf
          title: Статус
        title:
          type: string
          title: Название курса
          maxLength: 50
        sub_title:
          type: string
          title: Краткое описание курса
          maxLength: 75
        description:
          type: string
          title: Описание курса
        slug:
          title: URL
          oneOf:
          - type: string
            maxLength: 120
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        price:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Цена
        is_special:
          type: boolean
          title: Специальный курс
