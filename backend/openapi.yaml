          format: uuid
        attempt_id:
          type: string
          format: uuid
        send_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmitItem'
      required:
      - attempt_id
      - homework_id
      - items
      - send_at
    Cart:
      type: object
      properties:
        cart_id:
          type: integer
          readOnly: true
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CartCourse'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
